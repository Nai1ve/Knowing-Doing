name: OpenHands Builder smoke

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN to create one bounded real Python OpenHands build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.confirmation == 'RUN' }}
    name: Protected production smoke gate
    environment: production
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Validate deployment access
        run: |
          set -Eeuo pipefail
          for required in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER; do
            test -n "${!required:-}" || { echo "Missing required secret: $required" >&2; exit 1; }
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Run bounded Python smoke build
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash /home/ubuntu/knowing-doing-current/deploy/run-case-builder-smoke.sh'

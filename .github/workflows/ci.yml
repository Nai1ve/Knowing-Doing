name: CI and deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  workspace-runner:
    name: Workspace runner checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: workspace-runner/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy to server
    needs: [frontend, backend, workspace-runner]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain skipped deployment
        if: env.DEPLOY_SSH_KEY == ''
        run: |
          echo 'Deployment skipped: configure DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, and DEPLOY_PORT repository secrets.'
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.DEPLOY_SSH_KEY != ''
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Install production runtime secrets
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          LAB_TOKEN_SECRET: ${{ secrets.LAB_TOKEN_SECRET }}
          LAB_MYSQL_RUNNER_PASSWORD: ${{ secrets.LAB_MYSQL_RUNNER_PASSWORD }}
          LAB_MYSQL_ADMIN_PASSWORD: ${{ secrets.LAB_MYSQL_ADMIN_PASSWORD }}
          ZHIXING_MODEL_BASE_URL: ${{ secrets.ZHIXING_MODEL_BASE_URL || 'https://api.deepseek.com' }}
          ZHIXING_MODEL_API_KEY: ${{ secrets.ZHIXING_MODEL_API_KEY }}
          ZHIXING_MODEL_NAME: ${{ secrets.ZHIXING_MODEL_NAME || 'deepseek-flash' }}
          ZHIXING_ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIXING_ZHIHU_ACCESS_SECRET }}
          WORKSPACE_RUNNER_TOKEN: ${{ secrets.WORKSPACE_RUNNER_TOKEN }}
        run: |
          set -Eeuo pipefail
          for required in DEPLOY_HOST DEPLOY_USER LAB_TOKEN_SECRET LAB_MYSQL_RUNNER_PASSWORD LAB_MYSQL_ADMIN_PASSWORD ZHIXING_MODEL_API_KEY WORKSPACE_RUNNER_TOKEN; do
            test -n "${!required:-}" || { echo "Missing required secret: $required" >&2; exit 1; }
          done
          umask 077
          {
            printf '%s\n' 'NODE_ENV=production'
            printf '%s\n' 'LAB_API_HOST=127.0.0.1' 'LAB_API_PORT=3001'
            printf 'LAB_CORS_ORIGIN=http://%s\n' "$DEPLOY_HOST"
            printf '%s\n' 'LAB_MYSQL_HOST=127.0.0.1' 'LAB_MYSQL_PORT=13306' 'LAB_MYSQL_RUNNER_USER=zhixing_lab_runner'
            printf 'LAB_MYSQL_RUNNER_PASSWORD=%s\n' "$LAB_MYSQL_RUNNER_PASSWORD"
            printf '%s\n' 'LAB_MYSQL_ADMIN_USER=zhixing_lab_admin'
            printf 'LAB_MYSQL_ADMIN_PASSWORD=%s\n' "$LAB_MYSQL_ADMIN_PASSWORD"
            printf 'LAB_TOKEN_SECRET=%s\n' "$LAB_TOKEN_SECRET"
            printf '%s\n' 'LAB_RUN_LEASE_MS=1200000' 'LAB_RUN_IDLE_TIMEOUT_MS=300000' 'LAB_QUEUE_LEASE_MS=1800000' 'LAB_QUERY_TIMEOUT_MS=10000' 'LAB_MAX_ROWS=200' 'LAB_MAX_OUTPUT_BYTES=1048576' 'LAB_RUNNER_POOL_SIZE=6'
            printf '%s\n' 'ZHIXING_PRODUCT_DB_PATH=/home/ubuntu/knowing-doing-data/zhixing-product.db'
            printf 'ZHIXING_MODEL_BASE_URL=%s\n' "$ZHIXING_MODEL_BASE_URL"
            printf 'ZHIXING_MODEL_API_KEY=%s\n' "$ZHIXING_MODEL_API_KEY"
            printf 'ZHIXING_MODEL_NAME=%s\n' "$ZHIXING_MODEL_NAME"
            printf '%s\n' 'ZHIXING_MODEL_TIMEOUT_MS=300000'
            printf 'ZHIXING_ZHIHU_ACCESS_SECRET=%s\n' "$ZHIXING_ZHIHU_ACCESS_SECRET"
            printf '%s\n' 'ZHIXING_ZHIHU_API_BASE_URL=https://developer.zhihu.com' 'ZHIXING_RETRIEVAL_TIMEOUT_MS=15000' 'ZHIXING_RETRIEVAL_CACHE_TTL_MS=86400000'
            printf '%s\n' 'WORKSPACE_RUNNER_URL=http://127.0.0.1:3101'
            printf 'WORKSPACE_RUNNER_TOKEN=%s\n' "$WORKSPACE_RUNNER_TOKEN"
            printf '%s\n' 'ZHIXING_IDENTITY_MODE=shared_demo' 'ZHIXING_DEMO_LEARNER_ID=demo-learner'
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n install -d -m 0755 /etc/knowing-doing && sudo -n install -o root -g root -m 0600 /dev/stdin /etc/knowing-doing/backend.env"
          printf 'WORKSPACE_RUNNER_TOKEN=%s\n' "$WORKSPACE_RUNNER_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n install -d -m 0755 /home/ubuntu/knowing-doing-data && sudo -n install -o root -g root -m 0600 /dev/stdin /home/ubuntu/knowing-doing-data/workspace-runner.env"
      - name: Upload release source
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          tar -czf "$archive" --exclude='.git' .
          scp -P "$DEPLOY_PORT" "$archive" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/knowing-doing-$GITHUB_SHA.tar.gz"
      - name: Deploy immutable release
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "ZHIXING_RELEASE_ARCHIVE=/tmp/knowing-doing-$GITHUB_SHA.tar.gz bash -s -- '$GITHUB_SHA'" < deploy/deploy-remote.sh

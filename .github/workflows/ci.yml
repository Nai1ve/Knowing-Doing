name: CI and deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  workspace-runner:
    name: Workspace runner checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: workspace-runner/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  case-builder-agent:
    name: Case Builder Agent checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node --check case-builder-agent/src/server.mjs
      - run: test -f case-builder-agent/Dockerfile.openhands && bash -n deploy/run-case-builder-smoke.sh

  deploy:
    name: Deploy to server
    needs: [frontend, backend, workspace-runner, case-builder-agent]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain skipped deployment
        if: env.DEPLOY_SSH_KEY == ''
        run: |
          echo 'Deployment skipped: configure DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, and DEPLOY_PORT repository secrets.'
      - uses: webfactory/ssh-agent@v0.9.0
        if: env.DEPLOY_SSH_KEY != ''
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Install production runtime secrets
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          LAB_TOKEN_SECRET: ${{ secrets.LAB_TOKEN_SECRET }}
          LAB_MYSQL_RUNNER_PASSWORD: ${{ secrets.LAB_MYSQL_RUNNER_PASSWORD }}
          LAB_MYSQL_ADMIN_PASSWORD: ${{ secrets.LAB_MYSQL_ADMIN_PASSWORD }}
          ZHIXING_MODEL_BASE_URL: ${{ secrets.ZHIXING_MODEL_BASE_URL || 'https://api.deepseek.com' }}
          ZHIXING_MODEL_API_KEY: ${{ secrets.ZHIXING_MODEL_API_KEY }}
          ZHIXING_MODEL_NAME: ${{ secrets.ZHIXING_MODEL_NAME || 'deepseek-flash' }}
          ZHIXING_ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIXING_ZHIHU_ACCESS_SECRET }}
          ZHIHU_OAUTH_APP_ID: ${{ secrets.ZHIHU_OAUTH_APP_ID }}
          ZHIHU_OAUTH_APP_KEY: ${{ secrets.ZHIHU_OAUTH_APP_KEY }}
          ZHIHU_OAUTH_SCOPES: ${{ secrets.ZHIHU_OAUTH_SCOPES }}
          OAUTH_TOKEN_ENCRYPTION_KEY: ${{ secrets.OAUTH_TOKEN_ENCRYPTION_KEY }}
          SIGNED_DEVICE_SESSION_ENABLED: ${{ vars.SIGNED_DEVICE_SESSION_ENABLED || 'false' }}
          ZHIHU_OAUTH_ENABLED: ${{ vars.ZHIHU_OAUTH_ENABLED || 'false' }}
          ZHIHU_SOURCE_SYNC_ENABLED: ${{ vars.ZHIHU_SOURCE_SYNC_ENABLED || 'false' }}
          PLANNER_ASSESSMENT_V2_ENABLED: ${{ vars.PLANNER_ASSESSMENT_V2_ENABLED || 'false' }}
          PRACTICE_CARD_V2_ENABLED: ${{ vars.PRACTICE_CARD_V2_ENABLED || 'false' }}
          MIXED_GYM_ENABLED: ${{ vars.MIXED_GYM_ENABLED || 'false' }}
          LEGACY_CASE_FLOW_ENABLED: ${{ vars.LEGACY_CASE_FLOW_ENABLED || 'true' }}
          WORKSPACE_RUNNER_TOKEN: ${{ secrets.WORKSPACE_RUNNER_TOKEN }}
          # OpenHands Builder is enabled by default after the local smoke gate.
          # Set the repository variable CASE_BUILDER_ENABLED=false to pause it.
          CASE_BUILDER_ENABLED: ${{ vars.CASE_BUILDER_ENABLED || 'true' }}
          CASE_BUILDER_TOKEN: ${{ secrets.CASE_BUILDER_TOKEN }}
          CASE_BUILDER_LLM_BASE_URL: ${{ secrets.CASE_BUILDER_LLM_BASE_URL || secrets.ZHIXING_MODEL_BASE_URL || 'https://api.deepseek.com' }}
          CASE_BUILDER_LLM_API_KEY: ${{ secrets.CASE_BUILDER_LLM_API_KEY || secrets.ZHIXING_MODEL_API_KEY }}
          CASE_BUILDER_LLM_MODEL: ${{ secrets.CASE_BUILDER_LLM_MODEL || secrets.ZHIXING_MODEL_NAME || 'deepseek-flash' }}
          CASE_BUILDER_MYSQL_ROOT_PASSWORD: ${{ secrets.CASE_BUILDER_MYSQL_ROOT_PASSWORD }}
          ENVIRONMENT_RUNTIME_SIGNING_KEY: ${{ secrets.ENVIRONMENT_RUNTIME_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          for required in DEPLOY_HOST DEPLOY_USER LAB_TOKEN_SECRET LAB_MYSQL_RUNNER_PASSWORD LAB_MYSQL_ADMIN_PASSWORD ZHIXING_MODEL_API_KEY WORKSPACE_RUNNER_TOKEN; do
            test -n "${!required:-}" || { echo "Missing required secret: $required" >&2; exit 1; }
          done
          case "$CASE_BUILDER_ENABLED" in true|false) ;; *) echo 'CASE_BUILDER_ENABLED must be the repository variable true or false' >&2; exit 1 ;; esac
          for flag in SIGNED_DEVICE_SESSION_ENABLED ZHIHU_OAUTH_ENABLED ZHIHU_SOURCE_SYNC_ENABLED PLANNER_ASSESSMENT_V2_ENABLED PRACTICE_CARD_V2_ENABLED MIXED_GYM_ENABLED LEGACY_CASE_FLOW_ENABLED; do
            case "${!flag}" in true|false) ;; *) echo "$flag must be the repository variable true or false" >&2; exit 1 ;; esac
          done
          if [ "$ZHIHU_OAUTH_ENABLED" = true ]; then
            test "$SIGNED_DEVICE_SESSION_ENABLED" = true || { echo 'SIGNED_DEVICE_SESSION_ENABLED must be true when ZHIHU_OAUTH_ENABLED=true' >&2; exit 1; }
            for required in ZHIHU_OAUTH_APP_ID ZHIHU_OAUTH_APP_KEY OAUTH_TOKEN_ENCRYPTION_KEY; do
              test -n "${!required:-}" || { echo "Missing Zhihu OAuth secret: $required" >&2; exit 1; }
            done
            test "${#OAUTH_TOKEN_ENCRYPTION_KEY}" -ge 32 || { echo 'OAUTH_TOKEN_ENCRYPTION_KEY must contain at least 32 bytes' >&2; exit 1; }
          fi
          test "$ZHIHU_SOURCE_SYNC_ENABLED" = false || test "$ZHIHU_OAUTH_ENABLED" = true || { echo 'ZHIHU_SOURCE_SYNC_ENABLED requires ZHIHU_OAUTH_ENABLED=true' >&2; exit 1; }
          test "$MIXED_GYM_ENABLED" = false || test "$PRACTICE_CARD_V2_ENABLED" = true || { echo 'MIXED_GYM_ENABLED requires PRACTICE_CARD_V2_ENABLED=true' >&2; exit 1; }
          if [ "$CASE_BUILDER_ENABLED" = true ]; then
            for required in CASE_BUILDER_TOKEN CASE_BUILDER_LLM_API_KEY CASE_BUILDER_MYSQL_ROOT_PASSWORD ENVIRONMENT_RUNTIME_SIGNING_KEY; do
              test -n "${!required:-}" || { echo "Missing Case Builder secret: $required" >&2; exit 1; }
            done
          fi
          umask 077
          {
            printf '%s\n' 'NODE_ENV=production'
            printf '%s\n' 'LAB_API_HOST=127.0.0.1' 'LAB_API_PORT=3001'
            printf 'LAB_CORS_ORIGIN=http://%s\n' "$DEPLOY_HOST"
            printf '%s\n' 'LAB_MYSQL_HOST=127.0.0.1' 'LAB_MYSQL_PORT=13306' 'LAB_MYSQL_RUNNER_USER=zhixing_lab_runner'
            printf 'LAB_MYSQL_RUNNER_PASSWORD=%s\n' "$LAB_MYSQL_RUNNER_PASSWORD"
            printf '%s\n' 'LAB_MYSQL_ADMIN_USER=zhixing_lab_admin'
            printf 'LAB_MYSQL_ADMIN_PASSWORD=%s\n' "$LAB_MYSQL_ADMIN_PASSWORD"
            printf 'LAB_TOKEN_SECRET=%s\n' "$LAB_TOKEN_SECRET"
            printf '%s\n' 'LAB_RUN_LEASE_MS=1200000' 'LAB_RUN_IDLE_TIMEOUT_MS=300000' 'LAB_QUEUE_LEASE_MS=1800000' 'LAB_QUERY_TIMEOUT_MS=10000' 'LAB_MAX_ROWS=200' 'LAB_MAX_OUTPUT_BYTES=1048576' 'LAB_RUNNER_POOL_SIZE=6'
            printf '%s\n' 'ZHIXING_PRODUCT_DB_PATH=/home/ubuntu/knowing-doing-data/zhixing-product.db'
            printf 'ZHIXING_MODEL_BASE_URL=%s\n' "$ZHIXING_MODEL_BASE_URL"
            printf 'ZHIXING_MODEL_API_KEY=%s\n' "$ZHIXING_MODEL_API_KEY"
            printf 'ZHIXING_MODEL_NAME=%s\n' "$ZHIXING_MODEL_NAME"
            printf '%s\n' 'ZHIXING_MODEL_TIMEOUT_MS=300000'
            printf 'ZHIXING_ZHIHU_ACCESS_SECRET=%s\n' "$ZHIXING_ZHIHU_ACCESS_SECRET"
            printf '%s\n' 'ZHIXING_ZHIHU_API_BASE_URL=https://developer.zhihu.com' 'ZHIXING_RETRIEVAL_TIMEOUT_MS=15000' 'ZHIXING_RETRIEVAL_CACHE_TTL_MS=86400000'
            printf '%s\n' 'PUBLIC_ORIGIN=http://119.45.243.102' 'ZHIHU_OAUTH_REDIRECT_URI=http://119.45.243.102/api/auth/oauth/zhihu/callback'
            printf '%s\n' 'ALLOW_INSECURE_OAUTH_CALLBACK=true' 'ZHIHU_OAUTH_BASE_URL=https://openapi.zhihu.com' 'ZHIHU_OAUTH_AUTHORIZE_PATH=/authorize' 'ZHIHU_OAUTH_TOKEN_PATH=/access_token' 'ZHIHU_OAUTH_USER_PATH=/user' 'ZHIHU_OAUTH_COLLECTIONS_PATH=/user/collections' 'ZHIHU_OAUTH_COLLECTION_ITEMS_PATH=/user/collection/{collection_id}' 'ZHIHU_OAUTH_CONTENT_PATH=/user/content' 'ZHIHU_OAUTH_MOMENTS_PATH=/user/moments'
            printf 'ZHIHU_OAUTH_APP_ID=%s\n' "$ZHIHU_OAUTH_APP_ID"
            printf 'ZHIHU_OAUTH_APP_KEY=%s\n' "$ZHIHU_OAUTH_APP_KEY"
            printf 'ZHIHU_OAUTH_SCOPES=%s\n' "$ZHIHU_OAUTH_SCOPES"
            printf 'OAUTH_TOKEN_ENCRYPTION_KEY=%s\n' "$OAUTH_TOKEN_ENCRYPTION_KEY"
            printf 'SIGNED_DEVICE_SESSION_ENABLED=%s\n' "$SIGNED_DEVICE_SESSION_ENABLED"
            printf 'ZHIHU_OAUTH_ENABLED=%s\n' "$ZHIHU_OAUTH_ENABLED"
            printf 'ZHIHU_SOURCE_SYNC_ENABLED=%s\n' "$ZHIHU_SOURCE_SYNC_ENABLED"
            printf 'PLANNER_ASSESSMENT_V2_ENABLED=%s\n' "$PLANNER_ASSESSMENT_V2_ENABLED"
            printf 'PRACTICE_CARD_V2_ENABLED=%s\n' "$PRACTICE_CARD_V2_ENABLED"
            printf 'MIXED_GYM_ENABLED=%s\n' "$MIXED_GYM_ENABLED"
            printf 'LEGACY_CASE_FLOW_ENABLED=%s\n' "$LEGACY_CASE_FLOW_ENABLED"
            if [ "$SIGNED_DEVICE_SESSION_ENABLED" = true ]; then
              printf '%s\n' 'ZHIXING_IDENTITY_MODE=client'
            else
              printf '%s\n' 'ZHIXING_IDENTITY_MODE=shared_demo' 'ZHIXING_DEMO_LEARNER_ID=demo-learner'
            fi
            printf '%s\n' 'WORKSPACE_RUNNER_URL=http://127.0.0.1:3101'
            printf 'WORKSPACE_RUNNER_TOKEN=%s\n' "$WORKSPACE_RUNNER_TOKEN"
            printf 'CASE_BUILDER_ENABLED=%s\n' "$CASE_BUILDER_ENABLED"
            printf '%s\n' 'CASE_BUILDER_URL=http://127.0.0.1:3102'
            printf 'CASE_BUILDER_TOKEN=%s\n' "$CASE_BUILDER_TOKEN"
            printf 'ENVIRONMENT_RUNTIME_SIGNING_KEY=%s\n' "$ENVIRONMENT_RUNTIME_SIGNING_KEY"
            printf '%s\n' 'CASE_BUILDER_TASK_TIMEOUT_MS=1200000' 'CASE_BUILDER_MAX_REPAIR_ROUNDS=3' 'CASE_BUILDER_MAX_CONCURRENT=1' 'CASE_BUILDER_MAX_LOG_BYTES=65536' 'CASE_BUILDER_FAILURE_RETENTION_HOURS=24'
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n install -d -m 0755 /etc/knowing-doing && sudo -n install -o root -g root -m 0600 /dev/stdin /etc/knowing-doing/backend.env"
          {
            printf 'WORKSPACE_RUNNER_TOKEN=%s\n' "$WORKSPACE_RUNNER_TOKEN"
            printf 'WORKSPACE_ENVIRONMENT_SIGNING_KEY=%s\n' "$ENVIRONMENT_RUNTIME_SIGNING_KEY"
            printf 'WORKSPACE_RUNNER_REQUIRE_SIGNED_ENVIRONMENT=%s\n' "$CASE_BUILDER_ENABLED"
            printf '%s\n' 'WORKSPACE_RUNNER_MAX_ENVIRONMENT_IMAGE_BYTES=2147483648'
          } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n install -d -m 0755 /home/ubuntu/knowing-doing-data && sudo -n install -o root -g root -m 0600 /dev/stdin /home/ubuntu/knowing-doing-data/workspace-runner.env"
          if [ "$CASE_BUILDER_ENABLED" = true ]; then
            server_image_ref="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n grep '^CASE_BUILDER_OPENHANDS_IMAGE=' /home/ubuntu/knowing-doing-data/case-builder-agent.env | head -n 1 | cut -d= -f2-" || true)"
            test -n "$server_image_ref" || { echo 'Server Case Builder image is not configured; run deploy/setup-case-builder-agent.sh on the host first' >&2; exit 1; }
            case "$server_image_ref" in *@sha256:*) ;; *) echo 'Server CASE_BUILDER_OPENHANDS_IMAGE must be digest-pinned' >&2; exit 1 ;; esac
            {
              printf 'CASE_BUILDER_TOKEN=%s\n' "$CASE_BUILDER_TOKEN"
              printf 'CASE_BUILDER_OPENHANDS_IMAGE=%s\n' "$server_image_ref"
              printf '%s\n' 'CASE_BUILDER_OPENHANDS_COMMAND=/app/.venv/bin/python /usr/local/bin/zhixing-openhands-build.py'
              printf 'CASE_BUILDER_LLM_BASE_URL=%s\n' "$CASE_BUILDER_LLM_BASE_URL"
              printf 'CASE_BUILDER_LLM_API_KEY=%s\n' "$CASE_BUILDER_LLM_API_KEY"
              printf 'CASE_BUILDER_LLM_MODEL=%s\n' "$CASE_BUILDER_LLM_MODEL"
              printf 'CASE_BUILDER_MYSQL_ROOT_PASSWORD=%s\n' "$CASE_BUILDER_MYSQL_ROOT_PASSWORD"
              printf '%s\n' 'CASE_BUILDER_TASK_TIMEOUT_MS=1200000' 'CASE_BUILDER_MAX_CONCURRENT=1' 'CASE_BUILDER_MAX_LOG_BYTES=65536' 'CASE_BUILDER_MAX_REQUEST_BYTES=2097152' 'CASE_BUILDER_MAX_RUNTIME_IMAGE_BYTES=4294967296' 'CASE_BUILDER_TASK_MEMORY=4g' 'CASE_BUILDER_TASK_CPUS=2' 'CASE_BUILDER_TASK_PIDS=512' 'CASE_BUILDER_MYSQL_MEMORY=1024m' 'CASE_BUILDER_MYSQL_CPUS=1' 'CASE_BUILDER_MYSQL_PIDS=256' 'CASE_BUILDER_MYSQL_RUNTIME_LEASE_MS=1200000' 'CASE_BUILDER_MYSQL_EXECUTION_TIMEOUT_MS=10000'
            } | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n install -d -m 0755 /home/ubuntu/knowing-doing-data && sudo -n install -o root -g root -m 0600 /dev/stdin /home/ubuntu/knowing-doing-data/case-builder-agent.env"
          fi
      - name: Deploy immutable release
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "ZHIXING_REPO_ROOT=/home/ubuntu/knowing-doing-repo ZHIXING_REPO_URL=https://github.com/Nai1ve/Knowing-Doing.git bash -s -- '$GITHUB_SHA'" < deploy/deploy-remote.sh

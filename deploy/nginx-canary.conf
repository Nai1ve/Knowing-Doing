# Canary frontend + API for the rolling release. Served on :8888, isolated
# from production (:80 / :3001). The API proxies to the canary backend on
# :3002; both are backed by /home/ubuntu/knowing-doing-canary, which the
# canary deploy points at the staged release.
#
# Install once on the host:
#   sudo install -m 0644 nginx-canary.conf /etc/nginx/sites-enabled/canary
#   sudo nginx -t && sudo systemctl reload nginx
#
# Roll the canary back:
#   sudo rm /etc/nginx/sites-enabled/canary && sudo systemctl reload nginx
#   sudo systemctl disable --now knowing-doing-canary
#   sudo rm /home/ubuntu/knowing-doing-canary

server {
    listen 8888;
    listen [::]:8888;
    server_name 119.45.243.102 _;

    root /home/ubuntu/knowing-doing-canary/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
